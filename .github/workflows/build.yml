# 💀ABDO SAAD💀
name: Build ABDO SAAD APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostic
        run: |
          echo "── repo root ──"
          ls -la
          echo "── settings.gradle ──"
          cat settings.gradle 2>/dev/null || echo "no settings.gradle"
          echo "── app/ ──"
          ls -la app || true
          echo "── ANDROID_HOME ──"
          echo "$ANDROID_HOME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk = $SDK"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "installing platform 34..."
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true

      - name: Write local.properties
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Grant execute permission
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: List Gradle projects
        run: gradle projects --no-daemon 2>&1 | tee projects.log

      - name: Build Debug APK
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Locate APK
        id: locate
        if: always()
        run: |
          echo "── finding APKs ──"
          find . -name "*.apk" -type f 2>/dev/null | tee apk-list.txt
          count=$(wc -l < apk-list.txt)
          echo "found $count apk(s)"
          if [ "$count" -gt 0 ]; then
            echo "apk_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            projects.log
            apk-list.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: steps.locate.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ABDO-SAAD-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
          retention-days: 30
