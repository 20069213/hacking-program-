# 💀ABDO SAAD💀
name: Build ABDO SAAD APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostic — list files
        run: |
          echo "── repo root ──"
          ls -la
          echo "── app/ ──"
          ls -la app || true
          echo "── gradle wrapper ──"
          ls -la gradle/wrapper 2>/dev/null || echo "no gradle wrapper folder"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          set -e
          echo "── java version ──"
          java -version
          echo "── gradle version ──"
          gradle --version
          echo "── starting build ──"
          gradle assembleDebug --no-daemon --stacktrace --info --warning-mode all 2>&1 | tee build.log
          echo "── build finished exit=$? ──"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ABDO-SAAD-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
