# 💀ABDO SAAD💀
name: Build ABDO SAAD APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostic
        run: |
          echo "── repo ──"
          ls -la
          echo "── app/ ──"
          ls -la app || true
          echo "── ANDROID_HOME ──"
          echo "$ANDROID_HOME"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "no ANDROID_HOME dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure SDK components
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk = $SDK"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "installing platform 34..."
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || \
            yes | "$SDK/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Write local.properties
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Grant execute permission
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Build Debug APK
        run: |
          set -e
          java -version
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ABDO-SAAD-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
